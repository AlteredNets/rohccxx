name: v0.4.1 development baseline

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/development-baseline.yml'
      - 'benchmarks/**'

permissions:
  contents: read

jobs:
  repository-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with: {submodules: recursive}
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends cmake gcc-13 g++-13 autoconf automake libtool pkg-config
      - run: CC=gcc-13 CXX=g++-13 cmake -S . -B build-tests -DROHCCXX_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-tests --parallel
      - run: ctest --test-dir build-tests --output-on-failure

  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends cmake gcc-13 g++-13 autoconf automake libtool pkg-config curl
      - name: Build, validate, calibrate, and measure
        run: benchmarks/github_run.sh
      - uses: actions/upload-artifact@v6
        with:
          name: v0.4.1-development-baseline
          path: benchmark-run/artifacts/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
